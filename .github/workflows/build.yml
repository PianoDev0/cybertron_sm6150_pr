name: Build Cybertron Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (leave empty for current branch)'
        required: false
        default: ''
        type: string
      device:
        description: 'Target Device'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - liber
          - hanoip
      clean:
        description: 'Clean build'
        required: true
        default: false
        type: boolean
      update_toolchain:
        description: 'Update Neutron-Clang toolchain via antman'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - 'v*'
      - '*ksu'
      - '*KSU'
    paths-ignore:
      - 'README.md'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-matrix.outputs.devices }}
      target_branch: ${{ steps.set-matrix.outputs.target_branch }}
    steps:
      - name: Determine Target Devices & Branch
        id: set-matrix
        run: |
          INPUT_DEVICE="${{ github.event.inputs.device || inputs.device || 'both' }}"
          if [ "$INPUT_DEVICE" = "both" ]; then
            echo 'devices=["liber", "hanoip"]' >> $GITHUB_OUTPUT
          else
            echo "devices=[\"$INPUT_DEVICE\"]" >> $GITHUB_OUTPUT
          fi

          TARGET_BRANCH="${{ github.event.inputs.branch || inputs.branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "target_branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT

  build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup-matrix.outputs.devices) }}
    steps:
      - name: Maximize Build Space
        run: |
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (needs.setup-matrix.outputs.target_branch != '' && format('refs/heads/{0}', needs.setup-matrix.outputs.target_branch) || github.ref) }}
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex git \
            kmod libelf-dev libncurses-dev libssl-dev libxml2-utils lz4 make \
            openssl p7zip-full python3 python-is-python3 tar tofrodos xsltproc \
            xz-utils zip zlib1g-dev zstd
          
          # Prevent cyber.sh from re-running apt-get inside the build
          touch /tmp/.cybertron_kernel_requirements

      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: toolchains-neutron-gcc14-v3
          restore-keys: |
            toolchains-neutron-gcc14-
            toolchains-neutron-

      - name: Cache Ccache (${{ matrix.device }})
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.device }}-${{ needs.setup-matrix.outputs.target_branch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ needs.setup-matrix.outputs.target_branch }}-
            ccache-${{ matrix.device }}-

      - name: Setup KernelSU (${{ matrix.device }})
        run: |
          TARGET_BRANCH="${{ needs.setup-matrix.outputs.target_branch }}"
          if [[ "${TARGET_BRANCH,,}" == *ksu ]]; then
            echo "Branch '${TARGET_BRANCH}' ends with 'ksu'. Cloning manipvlator/KernelSU..."
            rm -rf KernelSU drivers/kernelsu
            git clone --depth=1 https://github.com/manipvlator/KernelSU.git KernelSU
            ln -sf ../KernelSU/kernel drivers/kernelsu
            if ! grep -q "kernelsu" drivers/Makefile; then
              echo -e "\nobj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
            fi
            if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            fi
            echo "ENABLE_KSU=1" >> $GITHUB_ENV
          else
            echo "Branch '${TARGET_BRANCH}' does not end with 'ksu'. Building clean Cybertron kernel."
            echo "ENABLE_KSU=0" >> $GITHUB_ENV
          fi

      - name: Setup AnyKernel3 (${{ matrix.device }})
        run: |
          # Use AnyKernel3 -b liber for liber, and -b hanoip for hanoip
          AK_BRANCH="${{ matrix.device }}"
          AK_DIR="${RUNNER_WORKSPACE}/anykernel_${{ matrix.device }}"
          rm -rf "${AK_DIR}"
          
          echo "Cloning AnyKernel3 (branch: ${AK_BRANCH}) from DhineshCool/AnyKernel3..."
          git clone --depth=1 -b "${AK_BRANCH}" https://github.com/DhineshCool/AnyKernel3.git "${AK_DIR}" || {
            echo "Warning: Branch ${AK_BRANCH} failed to clone, falling back to repository default..."
            git clone --depth=1 https://github.com/DhineshCool/AnyKernel3.git "${AK_DIR}"
          }

          # Export ZIP_DIR for cyber.sh
          echo "ZIP_DIR=${AK_DIR}" >> $GITHUB_ENV

      - name: Run Cybertron Build Script (${{ matrix.device }})
        env:
          TARGET_BRANCH: ${{ needs.setup-matrix.outputs.target_branch }}
          ENABLE_KSU: ${{ env.ENABLE_KSU }}
        run: |
          chmod +x cyber.sh

          BUILD_FLAGS=""
          if [ "${{ github.event.inputs.clean || inputs.clean }}" = "true" ]; then
            BUILD_FLAGS="${BUILD_FLAGS} --clean"
          fi
          if [ "${{ github.event.inputs.update_toolchain || inputs.update_toolchain }}" = "true" ]; then
            BUILD_FLAGS="${BUILD_FLAGS} --update-toolchain"
          fi

          set -o pipefail
          bash -x ./cyber.sh "${{ matrix.device }}" ${BUILD_FLAGS} 2>&1 | tee build.log

      - name: Upload Kernel Artifacts (${{ matrix.device }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cybertron-${{ needs.setup-matrix.outputs.target_branch }}-${{ matrix.device }}
          path: |
            build/*.zip
            build/Image.gz
            build/dtb
            build.log
          retention-days: 7

      - name: Send Build & Zip to Telegram (${{ matrix.device }})
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEVICE: ${{ matrix.device }}
          BRANCH: ${{ needs.setup-matrix.outputs.target_branch }}
          ENABLE_KSU: ${{ env.ENABLE_KSU }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi

          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RAW_TITLE=$(git log -1 --pretty=format:"%s")
          RAW_AUTHOR=$(git log -1 --pretty=format:"%an")
          SAFE_TITLE=$(echo "${RAW_TITLE}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          SAFE_AUTHOR=$(echo "${RAW_AUTHOR}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          NL=$'\n'

          if [ "${{ job.status }}" = "success" ]; then
            ZIP_FILE=$(find build -maxdepth 1 -name "Cybertron-*-${DEVICE}-*.zip" | head -n 1)
            
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              ZIP_NAME=$(basename "${ZIP_FILE}")
              ZIP_SIZE=$(du -h "${ZIP_FILE}" | cut -f1)
              ZIP_SIZE_BYTES=$(stat -c%s "${ZIP_FILE}")
              MD5=$(md5sum "${ZIP_FILE}" | cut -d' ' -f1)
              
              TITLE_LINE="✅ <b>Cybertron Kernel Build Succeeded!</b>"
              if [ "${ENABLE_KSU}" = "1" ] || [[ "${BRANCH,,}" == *ksu ]]; then
                TITLE_LINE="✅ <b>Cybertron Kernel (KernelSU) Build Succeeded!</b>"
              fi

              CAPTION="${TITLE_LINE}${NL}${NL}"
              CAPTION="${CAPTION}📱 <b>Device:</b> <code>${DEVICE}</code>${NL}"
              CAPTION="${CAPTION}🌿 <b>Branch:</b> <code>${BRANCH}</code>${NL}"
              CAPTION="${CAPTION}🔖 <b>Commit:</b> <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a>${NL}"
              CAPTION="${CAPTION}💬 <b>Message:</b> ${SAFE_TITLE}${NL}"
              CAPTION="${CAPTION}👤 <b>Author:</b> ${SAFE_AUTHOR}${NL}${NL}"
              CAPTION="${CAPTION}📦 <b>File:</b> <code>${ZIP_NAME}</code> (${ZIP_SIZE})${NL}"
              CAPTION="${CAPTION}🔒 <b>MD5:</b> <code>${MD5}</code>"

              # Telegram Bot API file upload limit is 50MB (52428800 bytes)
              if [ "$ZIP_SIZE_BYTES" -le 52428800 ]; then
                curl -s -F "chat_id=${CHAT_ID}" \
                     -F "document=@${ZIP_FILE}" \
                     -F "caption=${CAPTION}" \
                     -F "parse_mode=HTML" \
                     "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" | grep -q '"ok":true' || echo "Telegram sendDocument returned an error."
              else
                # File exceeds Telegram 50MB limit; send message with run link
                MSG="${CAPTION}${NL}${NL}⚠️ <i>Zip file (${ZIP_SIZE}) exceeds Telegram's 50MB limit. Download from GitHub Actions Run Artifacts.</i>"
                curl -s -F "chat_id=${CHAT_ID}" \
                     -F "text=${MSG}" \
                     -F "parse_mode=HTML" \
                     "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" > /dev/null
              fi
            fi
          else
            FAIL_TITLE="❌ <b>Cybertron Kernel Build Failed!</b>"
            if [ "${ENABLE_KSU}" = "1" ] || [[ "${BRANCH,,}" == *ksu ]]; then
              FAIL_TITLE="❌ <b>Cybertron Kernel (KernelSU) Build Failed!</b>"
            fi
            FAIL_MSG="${FAIL_TITLE}${NL}${NL}"
            FAIL_MSG="${FAIL_MSG}📱 <b>Device:</b> <code>${DEVICE}</code>${NL}"
            FAIL_MSG="${FAIL_MSG}🌿 <b>Branch:</b> <code>${BRANCH}</code>${NL}"
            FAIL_MSG="${FAIL_MSG}🔖 <b>Commit:</b> <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a>${NL}"
            FAIL_MSG="${FAIL_MSG}💬 <b>Message:</b> ${SAFE_TITLE}${NL}"
            FAIL_MSG="${FAIL_MSG}👤 <b>Author:</b> ${SAFE_AUTHOR}"

            if [ -f "build.log" ]; then
              TAIL_LOG=$(tail -n 15 build.log | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
              FAIL_MSG="${FAIL_MSG}${NL}${NL}<b>Error Output:</b>${NL}<pre>${TAIL_LOG}</pre>"
            fi

            FAIL_MSG="${FAIL_MSG}${NL}${NL}🔍 <b>Logs:</b> https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            curl -s -F "chat_id=${CHAT_ID}" \
                 -F "text=${FAIL_MSG}" \
                 -F "parse_mode=HTML" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" > /dev/null

            if [ -f "build.log" ]; then
              curl -s -F "chat_id=${CHAT_ID}" \
                   -F "document=@build.log" \
                   -F "caption=📄 <b>Build log for ${DEVICE} (${BRANCH})</b>" \
                   -F "parse_mode=HTML" \
                   "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" || true
            fi
          fi
